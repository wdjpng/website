---
layout: default
---
<!-- page.html -->
        <div class="post">

          <header class="post-header">
            <h1 class="post-title">{{ page.title }}</h1>
            <p class="post-description">{{ page.description }}</p>
            {% if page.show_author %}<p class="post-author">By <a href="{{ '/' | relative_url }}" rel="author">{{ site.person_name }}</a></p>{% endif %}
          </header>

          <article>
            {{ content }}
          </article>

        </div>
